name: "Attach Release Assets"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v0.1.0"
      run_id:
        description: "Workflow run ID to pull artifacts from"
        required: true
        default: "34135369521"

jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download artifacts and attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          echo "Downloading artifacts from run ${{ inputs.run_id }}..."
          gh run download "${{ inputs.run_id }}" --repo "${GITHUB_REPOSITORY}" --name "breath-scribe-p0-base-windows" --dir artifacts
          echo "Artifacts downloaded:"
          ls -lh artifacts
          echo "Uploading installer packages to release ${{ inputs.tag }}..."
          packages=()
          for file in artifacts/*.exe artifacts/*.msi; do
            if [ -f "$file" ]; then
              packages+=("$file")
            fi
          done
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "ERROR: No .exe or .msi installers found!" >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" "${packages[@]}" --clobber
          echo "Release assets successfully attached!"
