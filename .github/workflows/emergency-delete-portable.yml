name: Emergency delete portable release asset

on:
  push:
    paths:
      - .github/workflows/emergency-delete-portable.yml

permissions:
  contents: write

jobs:
  delete-portable-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.request('DELETE /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: 547263330
            })
