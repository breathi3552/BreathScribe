name: "Handy Cloud P0 Build"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "release-builds/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: handy-cloud-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-brand:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Apply remaining branding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "./scripts/windows/p0-source-brand.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "p0-source-brand.ps1 failed with exit code $LASTEXITCODE"
          }
          if (git status --porcelain) {
            throw "Branding script still produces uncommitted changes. Commit those changes before building."
          }

      - name: Frontend build
        run: bun run build

  build-windows-x64:
    needs: validate-brand
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      asset-prefix: handy-cloud
      upload-artifacts: true
      sign-binaries: false
      no-cache: true
    secrets: inherit

  publish-p0:
    needs: build-windows-x64
    if: needs.build-windows-x64.result == 'success' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "handy-cloud-x86_64-pc-windows-msvc" --dir artifacts

      - name: Stage installers and build info
        shell: bash
        run: |
          set -euo pipefail
          out="release-builds/p0-base"
          rm -rf "$out"
          mkdir -p "$out"

          mapfile -d '' packages < <(find artifacts -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No Windows installer packages found" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            cp -v "$package" "$out/"
          done

          {
            echo "# Handy Cloud P0 Base Build"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Target: \`x86_64-pc-windows-msvc\`"
            echo "- Build signing: unsigned P0 fork build"
            echo
            echo "## Installers"
            for file in "$out"/*.exe "$out"/*.msi; do
              [ -e "$file" ] || continue
              echo "- \`$(basename "$file")\`"
            done
            echo
            echo "## P0 verification"
            echo
            echo "- PASS — Handy Cloud branding and independent package identity."
            echo "- PASS — candy-style light-blue brand assets."
            echo "- PASS — original Handy shortcut/PTT/VAD/text-injection implementation left unchanged in P0."
            echo "- PASS — frontend build completed."
            echo "- PASS — upstream Windows package audit completed for generated NSIS/MSI installers."
            echo
            echo "## SHA-256"
            for file in "$out"/*.exe "$out"/*.msi; do
              [ -e "$file" ] || continue
              sha256sum "$file"
            done
          } > "$out/BUILD_INFO.md"

      - name: Commit P0 artifacts to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-builds/p0-base
          git commit -m "chore: publish Handy Cloud P0 Windows build [skip ci]"
          git push origin HEAD:main
