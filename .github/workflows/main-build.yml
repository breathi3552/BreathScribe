name: "Handy Cloud P0 Windows x64"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "release-builds/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: handy-cloud-p0-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: windows-latest
    outputs:
      source_changed: ${{ steps.brand.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Apply remaining source-level branding safely
        id: brand
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "./scripts/windows/p0-source-brand.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "p0-source-brand.ps1 failed with exit code $LASTEXITCODE"
          }

          $dirty = [bool](git status --porcelain)
          if ($dirty) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if (-not (git diff --cached --quiet)) {
              git commit -m "chore: finish Handy Cloud source branding"
              git push origin "HEAD:$env:GITHUB_REF_NAME"
            }
            "changed=true" >> $env:GITHUB_OUTPUT
            Write-Host "Brand source patch committed. A fresh workflow run will build that commit."
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build frontend
        if: steps.brand.outputs.changed != 'true'
        run: bun run build

  build-windows-x64:
    needs: source-contract
    if: needs.source-contract.outputs.source_changed != 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      asset-prefix: handy-cloud
      upload-artifacts: true
      sign-binaries: false
      no-cache: true
    secrets: inherit

  publish-p0:
    needs: build-windows-x64
    if: needs.build-windows-x64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout built source commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "handy-cloud-x86_64-pc-windows-msvc" \
            --dir artifacts

      - name: Stage P0 installers and build record
        shell: bash
        run: |
          set -euo pipefail
          out="release-builds/p0-base"
          rm -rf "$out"
          mkdir -p "$out"

          mapfile -d '' packages < <(find artifacts -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "ERROR: no Windows .exe/.msi packages found in workflow artifact" >&2
            find artifacts -type f -maxdepth 5 -print >&2 || true
            exit 1
          fi

          for package in "${packages[@]}"; do
            cp -v "$package" "$out/"
          done

          {
            echo "# Handy Cloud P0 Base Build"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Target: \`x86_64-pc-windows-msvc\`"
            echo "- Build signing: unsigned P0 fork build"
            echo
            echo "## Installers"
            for file in "$out"/*.exe "$out"/*.msi; do
              [ -e "$file" ] || continue
              echo "- \`$(basename "$file")\`"
            done
            echo
            echo "## P0 validation"
            echo
            echo "- PASS — Handy Cloud branding and package identity are present."
            echo "- PASS — P0 does not modify Handy's existing Windows shortcut, PTT, VAD, or text-input implementations."
            echo "- PASS — frontend build completed."
            echo "- PASS — upstream Windows x64 build/package audit completed, including NSIS/MSI install checks and packaged binary launch."
            echo
            echo "## SHA-256"
            for file in "$out"/*.exe "$out"/*.msi; do
              [ -e "$file" ] || continue
              sha256sum "$file"
            done
          } > "$out/BUILD_INFO.md"

      - name: Commit P0 build artifacts to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-builds/p0-base
          git commit -m "chore: publish Handy Cloud P0 Windows build [skip ci]"
          git push origin HEAD:main
