name: "Handy Cloud P0 Windows x64"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "release-builds/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: handy-cloud-p0-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      asset-prefix: handy-cloud
      upload-artifacts: true
      sign-binaries: false
      no-cache: false
    secrets: inherit

  publish-p0:
    needs: build-windows-x64
    if: needs.build-windows-x64.result == 'success' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout built source commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify preserved P0 core source paths
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'handy-keys = "0.3.4"' src-tauri/Cargo.toml
          test -f src-tauri/src/shortcut/handy_keys.rs
          test -f src-tauri/src/shortcut/handler.rs
          test -f src-tauri/src/input.rs
          test -d src-tauri/src/paste_tx
          echo "Core shortcut and text-injection source paths are present."

      - name: Download Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "handy-cloud-x86_64-pc-windows-msvc" \
            --dir artifacts

      - name: Stage P0 installers and build record
        shell: bash
        run: |
          set -euo pipefail
          out="release-builds/p0-base"
          rm -rf "$out"
          mkdir -p "$out"

          mapfile -d '' packages < <(find artifacts -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "ERROR: no Windows .exe/.msi packages found in workflow artifact" >&2
            find artifacts -type f -maxdepth 5 -print >&2 || true
            exit 1
          fi

          for package in "${packages[@]}"; do
            cp -v "$package" "$out/"
          done

          {
            echo "# Handy Cloud P0 Base Build"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Target: \`x86_64-pc-windows-msvc\`"
            echo "- Build signing: unsigned P0 fork build"
            echo "- Updater artifacts: disabled for P0"
            echo
            echo "## Installers"
            for file in "$out"/*.exe "$out"/*.msi; do
              [ -e "$file" ] || continue
              echo "- \`$(basename "$file")\`"
            done
            echo
            echo "## Automated P0 verification"
            echo
            echo "- PASS — Windows x64 Tauri build completed."
            echo "- PASS — upstream Windows NSIS/MSI package runtime audit completed, including packaged executable launch via \`--list-devices\`."
            echo "- PASS — \`handy-keys 0.3.4\` remained in the Windows build dependency chain and the existing shortcut/text-injection source paths remain present."
            echo "- NOT INTERACTIVE-CI VERIFIED — physical global Win+H suppression, keydown/keyup delivery and end-to-end Push-To-Talk behavior require an interactive Windows desktop smoke test; GitHub-hosted runners cannot truthfully certify that shell-level behavior."
            echo
            echo "## SHA-256"
            for file in "$out"/*.exe "$out"/*.msi; do
              [ -e "$file" ] || continue
              sha256sum "$file"
            done
          } > "$out/BUILD_INFO.md"

      - name: Commit P0 build artifacts to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-builds/p0-base
          if git diff --cached --quiet; then
            echo "No P0 artifact changes to commit"
            exit 0
          fi
          git commit -m "chore: publish Handy Cloud P0 Windows build [skip ci]"
          git push origin HEAD:main
