name: "Handy Cloud P0 Windows x64"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "release-builds/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: handy-cloud-p0-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-brand-assets:
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend tooling
        run: bun install --frozen-lockfile

      - name: Normalize P0 brand source
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = (Resolve-Path "brand/handy-cloud-icon-source.png").Path
          $temp = Join-Path $env:RUNNER_TEMP "handy-cloud-icon-source.normalized.png"
          $image = [System.Drawing.Image]::FromFile($source)
          try {
            $bitmap = New-Object System.Drawing.Bitmap $image.Width, $image.Height
            try {
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try { $graphics.DrawImageUnscaled($image, 0, 0) } finally { $graphics.Dispose() }
              $bitmap.Save($temp, [System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bitmap.Dispose() }
          } finally { $image.Dispose() }
          Move-Item -Force $temp $source

      - name: Materialize Handy Cloud brand assets
        shell: pwsh
        run: ./scripts/windows/p0-source-brand.ps1

      - name: Verify final source branding
        shell: pwsh
        run: ./scripts/windows/p0-regression.ps1

      - name: Commit generated binary brand assets when source changed
        id: commit
        shell: pwsh
        run: |
          git add -- brand/handy-cloud-icon-source.png brand/P0_ICON_GENERATED.txt src-tauri/icons src-tauri/resources src/i18n/locales package.json bun.lock src-tauri/Cargo.toml src-tauri/src/tray.rs src/components/settings/about/AboutSettings.tsx README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Final brand assets are already committed in main."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: commit Handy Cloud platform icon assets"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit generated brand assets" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to push generated brand assets" }
          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build-windows-x64:
    needs: materialize-brand-assets
    if: needs.materialize-brand-assets.outputs.changed != 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      asset-prefix: handy-cloud
      upload-artifacts: true
      sign-binaries: false
      no-cache: false
    secrets: inherit

  verify-windows-packages:
    needs: build-windows-x64
    if: needs.build-windows-x64.result == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: handy-cloud-x86_64-pc-windows-msvc
          path: artifacts

      - name: Verify source and packaged branding
        shell: pwsh
        run: ./scripts/windows/p0-regression.ps1 -PackageDir artifacts

      - name: Win+H source smoke guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "src-tauri/src/shortcut/handy_keys.rs",
            "src-tauri/src/shortcut/handler.rs",
            "src-tauri/src/shortcut/mod.rs",
            "src-tauri/src/input.rs"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing Windows shortcut path: $file" }
          }
          $shortcutSource = (Get-Content "src-tauri/src/shortcut/handy_keys.rs" -Raw) + (Get-Content "src-tauri/src/shortcut/mod.rs" -Raw)
          if ($shortcutSource -notmatch "blocking|block") { throw "Blocking hotkey path is no longer discoverable" }
          if ($shortcutSource -notmatch "Windows|Meta|Super|Win") { throw "Windows modifier path is no longer discoverable" }
          Write-Host "PASS - Win+H/blocking-hotkey source smoke guard"

  publish-p0:
    needs: [build-windows-x64, verify-windows-packages]
    if: needs.build-windows-x64.result == 'success' && needs.verify-windows-packages.result == 'success' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout built source commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "handy-cloud-x86_64-pc-windows-msvc" --dir artifacts

      - name: Stage P0 installers and build record
        shell: bash
        run: |
          set -euo pipefail
          out="release-builds/p0-base"
          rm -rf "$out"
          mkdir -p "$out"
          mapfile -d '' packages < <(find artifacts -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "ERROR: no Windows .exe/.msi packages found in workflow artifact" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do cp -v "$package" "$out/"; done
          {
            echo "# Handy Cloud P0 Base Build"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Target: \`x86_64-pc-windows-msvc\`"
            echo "- Build signing: unsigned P0 fork build"
            echo "- Updater artifacts: disabled for P0"
            echo
            echo "## Installers"
            for file in "$out"/*.exe "$out"/*.msi; do [ -e "$file" ] && echo "- \`$(basename "$file")\`"; done
            echo
            echo "## Automated P0 verification"
            echo "- PASS — final tracked platform/tray icon assets differ byte-for-byte from cjpais/Handy and match the approved source marker."
            echo "- PASS — Windows x64 Tauri build completed and EXE/MSI artifacts were produced."
            echo "- PASS — MSI ProductName and NSIS executable version metadata were checked for Handy Cloud branding."
            echo "- PASS — Win+H/blocking-hotkey source smoke guard and preserved core path checks completed without modifying core interaction logic."
            echo "- NOT INTERACTIVE-CI VERIFIED — physical global Win+H suppression, keydown/keyup delivery and end-to-end Push-To-Talk behavior require an interactive Windows desktop smoke test."
            echo
            echo "## SHA-256"
            for file in "$out"/*.exe "$out"/*.msi; do [ -e "$file" ] && sha256sum "$file"; done
          } > "$out/BUILD_INFO.md"

      - name: Commit P0 build artifacts to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-builds/p0-base
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish Handy Cloud P0 Windows build [skip ci]"
          git push origin HEAD:main
