<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="ambientShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle with Soft Border -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#0f172a" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4" />

  <g filter="url(#ambientShadow)">
    <!-- Cloud Base Body -->
    <path d="M 140 350
             C 105 350, 90 320, 105 285
             C 100 240, 140 215, 175 225
             C 200 170, 275 165, 310 210
             C 345 195, 395 220, 390 265
             C 425 290, 415 350, 365 350
             Z" fill="url(#cloudGrad)" />
    
    <!-- 5 Upward Rhythmic Soundwave Pillars -->
    <rect x="180" y="240" width="22" height="70" rx="11" fill="#ffffff" />
    <rect x="220" y="200" width="22" height="110" rx="11" fill="#ffffff" />
    <rect x="260" y="170" width="22" height="140" rx="11" fill="#ffffff" />
    <rect x="300" y="210" width="22" height="100" rx="11" fill="#ffffff" />
    <rect x="340" y="250" width="22" height="60" rx="11" fill="#ffffff" />
  </g>
</svg>
